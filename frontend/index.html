<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điểm danh sinh viên</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 45%, #ec4899 100%);
            background-attachment: fixed;
        }
        .field {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.9rem;
            background: #f9fafb;
            transition: all 0.15s;
        }
        .field:focus {
            outline: none;
            border-color: #6366f1;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white/95 backdrop-blur rounded-3xl shadow-2xl p-7 my-6">

        <div class="text-center mb-7">
            <div class="w-16 h-16 mx-auto mb-3 rounded-2xl bg-gradient-to-br from-indigo-500 to-pink-500 flex items-center justify-center text-3xl shadow-lg">🎓</div>
            <h2 class="text-2xl font-extrabold text-gray-800">Điểm danh sinh viên</h2>
            <p class="text-gray-500 text-sm mt-1">Điền thông tin của bạn để xác nhận có mặt</p>
        </div>
        <div id="locBox" class="mb-5 rounded-2xl p-4 text-sm bg-amber-50 border border-amber-200 text-amber-800">
            <div id="locMsg">📍 Đang xin quyền vị trí... Khi trình duyệt hỏi, hãy bấm <b>Cho phép</b>.</div>
            <div id="locHelp" class="hidden mt-3 leading-relaxed"></div>
            <button id="locRetry" type="button"
                class="hidden mt-3 w-full bg-indigo-500 text-white font-semibold py-2 rounded-xl">
                🔄 Tôi đã bật, tải lại trang
            </button>
        </div>
        <form id="attendanceForm" class="space-y-4">
            <div>
                <label for="school" class="block text-sm font-semibold text-gray-700 mb-1">🏫 Trường</label>
                <select id="school" class="field">
                    <option value="">— Chọn trường —</option>
                    <option value="USSH">USSH</option>
                    <option value="UEH">UEH</option>
                    <option value="VLU">VLU</option>
                    <option value="DVSC">DVSC</option>
                </select>
            </div>

            <div>
                <label for="universityRollNo" class="block text-sm font-semibold text-gray-700 mb-1">🆔 Mã số sinh viên</label>
                <input type="text" id="universityRollNo" placeholder="Nhập mã số sinh viên" class="field" autocomplete="off" autocapitalize="characters" spellcheck="false" style="text-transform:uppercase">
            </div>

            <div>
                <label for="name" class="block text-sm font-semibold text-gray-700 mb-1">👤 Họ và tên</label>
                <input type="text" id="name" placeholder="Nhập họ và tên" class="field" autocomplete="off">
            </div>

            <button type="submit"
                class="w-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-white font-bold py-3.5 rounded-xl shadow-lg hover:opacity-90 active:scale-95 transition flex items-center justify-center gap-2">
                ✅ Xác nhận điểm danh
            </button>
        </form>

        <p id="status" class="text-center mt-5 text-sm font-medium"></p>

        <p class="text-center text-xs text-gray-400 mt-4">📍 Hãy cho phép vị trí khi trình duyệt hỏi</p>

        <!-- Khung xem điểm danh cá nhân: đang ẩn, xóa style="display:none" để bật lại khi nâng cấp -->
        <div class="mt-8" style="display:none">
            <label for="rollInput" class="block text-sm font-semibold text-gray-700 mb-1">Kiểm tra điểm danh của bạn</label>
            <div class="flex gap-2">
                <input type="text" id="rollInput" placeholder="Nhập mã số sinh viên" class="field flex-grow">
                <button id="view-dashboard-btn" class="bg-indigo-500 text-white px-4 rounded-xl font-semibold">Xem</button>
            </div>
        </div>

        <div id="accessMessage" class="text-sm text-center mt-4 text-red-600 font-medium"></div>

        <div id="dashboard" class="mt-6 hidden">
            <h3 class="text-lg font-semibold text-gray-800 mb-4 text-center">Lịch sử điểm danh</h3>
            <div class="overflow-x-auto">
                <table class="min-w-full table-auto border border-gray-300 text-sm text-left">
                    <thead class="bg-indigo-100 text-gray-700">
                        <tr>
                            <th class="px-4 py-2 border">Ngày</th>
                            <th class="px-4 py-2 border">Giờ</th>
                            <th class="px-4 py-2 border">Thiết bị</th>
                            <th class="px-4 py-2 border">Vị trí</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTable" class="bg-white"></tbody>
                </table>
            </div>
        </div>
    </div>
        <script>
    (function () {
        var box = document.getElementById('locBox');
        var msg = document.getElementById('locMsg');
        var help = document.getElementById('locHelp');
        var retry = document.getElementById('locRetry');
        var ua = navigator.userAgent;
        var isIOS = /iPhone|iPad|iPod/i.test(ua);
        var isAndroid = /Android/i.test(ua);
        var inApp = /Zalo|FBAN|FBAV|FB_IAB|Messenger|Instagram|Line\/|MicroMessenger|TikTok/i.test(ua);

        function setStyle(kind) {
            var map = {
                wait: 'bg-amber-50 border-amber-200 text-amber-800',
                ok:   'bg-emerald-50 border-emerald-200 text-emerald-800',
                bad:  'bg-rose-50 border-rose-200 text-rose-800'
            };
            box.className = 'mb-5 rounded-2xl p-4 text-sm border ' + map[kind];
        }

        function showHelp() {
            var steps;
            if (isIOS) {
                steps = '<b>Trên iPhone:</b><ol class="list-decimal ml-5 mt-1 space-y-1">' +
                    '<li>Vào <b>Cài đặt → Quyền riêng tư &amp; Bảo mật → Dịch vụ định vị</b> và bật.</li>' +
                    '<li>Kéo xuống chọn <b>Safari Websites</b> → <b>Khi dùng ứng dụng</b>.</li>' +
                    '<li>Quay lại Safari, bấm <b>aA</b> cạnh thanh địa chỉ → <b>Cài đặt trang web → Vị trí → Cho phép</b>.</li>' +
                    '<li>Bấm nút bên dưới để tải lại trang.</li></ol>';
            } else if (isAndroid) {
                steps = '<b>Trên Android:</b><ol class="list-decimal ml-5 mt-1 space-y-1">' +
                    '<li>Vuốt từ trên xuống, bật <b>Vị trí (GPS)</b>.</li>' +
                    '<li>Bấm biểu tượng <b>bên trái thanh địa chỉ</b> → <b>Quyền → Vị trí → Cho phép</b>.</li>' +
                    '<li>Bấm nút bên dưới để tải lại trang.</li></ol>';
            } else {
                steps = '<b>Trên máy tính:</b> bấm biểu tượng bên trái thanh địa chỉ → <b>Vị trí → Cho phép</b>, rồi tải lại trang.';
            }
            help.innerHTML = steps;
            help.classList.remove('hidden');
            retry.classList.remove('hidden');
        }

        function ask() {
            if (!navigator.geolocation) {
                setStyle('bad');
                msg.innerHTML = '❌ Trình duyệt này không hỗ trợ định vị. Hãy mở bằng Chrome hoặc Safari.';
                return;
            }
            navigator.geolocation.getCurrentPosition(
                function () {
                    setStyle('ok');
                    msg.innerHTML = '✅ Đã nhận vị trí. Bạn có thể điểm danh.';
                    help.classList.add('hidden');
                    retry.classList.add('hidden');
                },
                function (err) {
                    setStyle('bad');
                    if (err.code === 1) {
                        msg.innerHTML = '🚫 Bạn chưa cho phép vị trí nên chưa điểm danh được. Làm theo hướng dẫn dưới đây:';
                        showHelp();
                    } else if (err.code === 2) {
                        msg.innerHTML = '📡 Chưa xác định được vị trí. Hãy bật <b>Vị trí (GPS)</b> của điện thoại, ra chỗ thoáng rồi thử lại.';
                        retry.classList.remove('hidden');
                    } else {
                        msg.innerHTML = '⏱ Lấy vị trí quá lâu. Hãy bật GPS, ra chỗ thoáng rồi thử lại.';
                        retry.classList.remove('hidden');
                    }
                },
                { enableHighAccuracy: true, timeout: 15000 }
            );
        }

        retry.addEventListener('click', function () { location.reload(); });

        if (inApp) {
            setStyle('bad');
            msg.innerHTML = '⚠️ Bạn đang mở trong ứng dụng (Zalo/Messenger...) nên có thể không cấp được vị trí. ' +
                'Hãy bấm <b>⋮ hoặc biểu tượng chia sẻ → Mở bằng Chrome/Safari</b>, hoặc sao chép link dán vào trình duyệt.';
            help.innerHTML = '<button type="button" id="locCopy" class="mt-1 bg-white border border-rose-300 text-rose-700 font-semibold px-3 py-2 rounded-xl">📋 Sao chép liên kết</button>';
            help.classList.remove('hidden');
            document.getElementById('locCopy').addEventListener('click', function () {
                if (navigator.clipboard) navigator.clipboard.writeText(location.href);
                this.textContent = '✅ Đã sao chép, hãy dán vào Chrome/Safari';
            });
        }

        window.addEventListener('load', ask);

        // Mã số sinh viên: tự viết hoa, bỏ khoảng trắng
        document.getElementById('universityRollNo').addEventListener('input', function () {
            var pos = this.selectionStart;
            this.value = this.value.toUpperCase().replace(/\s+/g, '');
            try { this.setSelectionRange(pos, pos); } catch (e) {}
        });

        // Nhớ trường đã chọn lần trước để lần sau không phải chọn lại
        try {
            var sv = localStorage.getItem('school');
            if (sv) document.getElementById('school').value = sv;
            document.getElementById('school').addEventListener('change', function () { localStorage.setItem('school', this.value); });
        } catch (e) {}
    })();
    </script>
</body>
</html>
