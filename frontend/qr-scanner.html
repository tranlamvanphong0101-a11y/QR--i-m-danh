<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo mã QR điểm danh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 45%, #ec4899 100%);
            background-attachment: fixed;
        }
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .qr-frame {
            padding: 6px;
            border-radius: 28px;
            background: linear-gradient(135deg, #22d3ee, #6366f1, #ec4899);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="bg-white/95 backdrop-blur rounded-3xl shadow-2xl max-w-md w-full p-8 text-center">
        <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-indigo-500 to-pink-500 flex items-center justify-center text-3xl shadow-lg">📱</div>
        <h1 class="text-2xl font-extrabold text-gray-800">Tạo mã QR điểm danh</h1>
        <p class="text-gray-500 text-sm mt-1 mb-6">Nhập mật khẩu, bấm tạo mã rồi chiếu cho lớp quét</p>

        <div class="flex justify-center mb-5">
            <div id="qr-container" class="relative">
                <div class="qr-frame">
                    <img id="qr-image" src="" alt="Mã QR" class="w-64 h-64 rounded-3xl bg-white hidden">
                </div>
                <div id="qr-loading" class="absolute inset-0 flex items-center justify-center hidden">
                    <div class="spinner rounded-full h-12 w-12 border-t-4 border-b-4 border-indigo-500"></div>
                </div>
            </div>
        </div>

        <div id="error-message" class="text-rose-500 font-medium mb-3 min-h-6 text-sm"></div>

        <div id="session-info" class="text-sm text-gray-600 mb-4 hidden bg-indigo-50 rounded-xl p-3">
            Mã phiên: <span id="session-id" class="font-mono text-xs break-all"></span><br>
            <span class="font-semibold text-indigo-600">⏱ Còn hiệu lực: <span id="expiry-time"></span></span>
        </div>

        <input type="password" id="adminPassword" placeholder="🔒 Mật khẩu giảng viên"
               class="w-full p-3 border-2 border-gray-200 rounded-xl mb-3 focus:outline-none focus:border-indigo-500">
        <button id="generate-btn"
                class="w-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg hover:opacity-90 active:scale-95 transition disabled:opacity-60">
            Tạo mã QR
        </button>
        <p class="text-xs text-gray-400 mt-4">📍 Hãy cho phép vị trí: sinh viên phải ở gần bạn mới điểm danh được</p>
    </div>

    <script>
        const API_BASE = '';
        let currentSessionId = null;
        let expiryInterval = null;
        let autoRefreshTimerId = null;

        function updateExpiryTimer(expiresInMs) {
            clearInterval(expiryInterval);
            let remainingTimeMs = expiresInMs;

            const updateDisplay = () => {
                if (remainingTimeMs <= 0) {
                    clearInterval(expiryInterval);
                    document.getElementById('expiry-time').textContent = `0p 0s - Đã hết hạn`;
                    document.getElementById('qr-image').classList.add('hidden');
                    showError('Mã QR đã hết hạn. Hãy tạo mã mới.');
                    currentSessionId = null;
                    return;
                }
                const minutes = Math.floor(remainingTimeMs / 60000);
                const seconds = Math.floor((remainingTimeMs % 60000) / 1000);
                document.getElementById('expiry-time').textContent = `${minutes}p ${seconds}s`;
            };

            updateDisplay();
            expiryInterval = setInterval(() => {
                remainingTimeMs -= 1000;
                updateDisplay();
            }, 1000);
        }

        function showError(message) {
            document.getElementById('error-message').textContent = message;
        }

        function clearError() {
            document.getElementById('error-message').textContent = '';
        }

        async function generateQR() {
            const generateBtn = document.getElementById('generate-btn');

            if (autoRefreshTimerId) {
                clearTimeout(autoRefreshTimerId);
                autoRefreshTimerId = null;
            }

            generateBtn.disabled = true;
            generateBtn.textContent = "Đang tạo mã...";
            clearError();
            document.getElementById('qr-image').classList.add('hidden');
            document.getElementById('qr-loading').classList.remove('hidden');
            document.getElementById('session-info').classList.add('hidden');

            try {
                const pos = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(
                        p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude }),
                        () => reject(new Error('Hãy cho phép truy cập vị trí rồi bấm lại')),
                        { enableHighAccuracy: true, timeout: 15000 }
                    );
                });
                const response = await axios.get(`${API_BASE}/api/generate-qr`, {
                    params: { lat: pos.lat, lng: pos.lng },
                    headers: { 'x-admin-password': document.getElementById('adminPassword').value }
                });
                const data = response.data;

                if (data.status === "success" && data.qrImage && data.sessionId && typeof data.expiresIn === 'number') {
                    const qrImage = document.getElementById('qr-image');
                    qrImage.onload = () => {
                        qrImage.classList.remove('hidden');
                        document.getElementById('qr-loading').classList.add('hidden');
                    };
                    qrImage.onerror = () => {
                        showError('Không tải được ảnh mã QR');
                        document.getElementById('qr-loading').classList.add('hidden');
                    };
                    qrImage.src = `${API_BASE}${data.qrImage}?t=${Date.now()}`;

                    document.getElementById('session-id').textContent = data.sessionId;
                    document.getElementById('session-info').classList.remove('hidden');

                    currentSessionId = data.sessionId;
                    updateExpiryTimer(data.expiresIn);

                    if (data.expiresIn > 10000) {
                        autoRefreshTimerId = setTimeout(() => {
                            generateQR();
                        }, data.expiresIn - 10000);
                    } else if (data.expiresIn > 0) {
                        autoRefreshTimerId = setTimeout(() => {}, data.expiresIn);
                    }
                } else {
                    throw new Error(data.message || 'Phản hồi không hợp lệ từ máy chủ');
                }
            } catch (error) {
                console.error("QR generation failed:", error);
                showError(error.response?.data?.message || error.message || 'Không tạo được mã QR');
                document.getElementById('qr-loading').classList.add('hidden');
                currentSessionId = null;
            } finally {
                generateBtn.disabled = false;
                generateBtn.textContent = "Tạo mã QR";
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('generate-btn').addEventListener('click', generateQR);
        });
    </script>
</body>
</html>
